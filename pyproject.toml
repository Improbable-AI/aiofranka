[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "aiofranka"
version = "0.5.1"
description = "A Python package for Franka robot control using asyncio."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "aiofranka/model/LICENSE"]
authors = [
    {name = "MIT Improbable AI Lab"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    # PyPI has no official macOS build of pylibfranka. pylibfranka-macos is an unofficial one for
    # Apple Silicon and macOS 15 (Darwin 24) or newer. On other Macs, build pylibfranka from source.
    "pylibfranka; sys_platform != 'darwin'",
    "pylibfranka-macos; sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release >= '24'",
    "ruckig",
    "numpy",
    "scipy",
    "mujoco>=3.10",
    "tqdm",
    "requests",
    "pyzmq",
    "msgpack",
]

[project.scripts]
aiofranka = "aiofranka.__main__:main"

[project.optional-dependencies]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
]
robotiq = [
    "minimalmodbus",
    "pyrobotiqgripper",
]

[project.urls]
Homepage = "https://github.com/younghyopark/aiofranka"
Repository = "https://github.com/younghyopark/aiofranka"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["aiofranka", "aiofranka.*"]
namespaces = false

[tool.setuptools.package-data]
aiofranka = [
    "model/fr3.xml",
    "model/scene.xml",
    "model/assets/link*_*.obj",
    "model/assets/link1.obj",
    "model/assets/link2.obj",
    "model/assets/*.stl",
]
